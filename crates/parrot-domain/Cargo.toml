[package]
name = "parrot-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
bytes = "=1.12.1"
protobuf = "=3.7.2"
tiktoken-rs = "=0.12.1"
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "codegen"] }

[build-dependencies]
home = "=0.5.11"
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"
protobuf-parse = "=3.7.2"
tonic-build = { version = "=0.12.3", default-features = false }

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"

[lints]
workspace = true
