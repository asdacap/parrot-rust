[package]
name = "parrot-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.138", features = ["raw_value"] }
tokio = { version = "=1.43.0", default-features = false, features = ["process", "io-util", "sync", "time", "macros", "rt", "net"] }

[dev-dependencies]
tokio = { version = "=1.43.0", default-features = false, features = ["test-util"] }

[lints]
workspace = true
