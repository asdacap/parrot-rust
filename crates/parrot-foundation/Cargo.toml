[package]
name = "parrot-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
parrot-domain = { path = "../parrot-domain" }
tokio = { version = "=1.43.0", default-features = false, features = ["rt", "sync", "macros", "net", "io-util", "time"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["rustls-tls"] }
base64 = "=0.22.1"
sha2 = "=0.10.8"
getrandom = "=0.2.17"
chrono = { version = "=0.4.39", default-features = false, features = ["std"] }
yaml-rust2 = { version = "=0.10.4", default-features = false }
serde_json = { version = "=1.0.138", features = ["preserve_order", "raw_value"] }
serde = { version = "=1.0.229", features = ["derive"] }
unicode-segmentation = "=1.12.0"
unicode-general-category = "=1.0.0"
url = { version = "=2.5.4", default-features = false }
minijinja = { version = "=3.0.1", features = ["serde", "fuel", "preserve_order"] }

[[test]]
name = "paths"
path = "tests/paths/main.rs"

[[test]]
name = "config"
path = "tests/config/main.rs"

[[test]]
name = "credentials"
path = "tests/credentials/main.rs"

[[test]]
name = "oauth"
path = "tests/oauth/main.rs"

[lints]
workspace = true
