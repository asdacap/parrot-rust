[package]
name = "t30-additive-review"
version = "0.0.0-dev"
edition = "2021"
[dependencies]
parrot-provider = { path = "/mnt/workspace/repo/parrot-rust/crates/parrot-provider" }
parrot-domain = { path = "/mnt/workspace/repo/parrot-rust/crates/parrot-domain" }
parrot-foundation = { path = "/mnt/workspace/repo/parrot-rust/crates/parrot-foundation" }
serde_json = { version = "=1.0.138", features = ["preserve_order", "raw_value"] }
