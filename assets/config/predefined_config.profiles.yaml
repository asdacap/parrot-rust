
# Default foreground profile when no mode is selected explicitly.
default_profile: general

# Foreground modes and child-agent profiles. Higher-precedence configuration can
# override individual fields while inheriting the rest of each definition.
# Optional allowed_tools semantics: omitted allows every otherwise-available
# tool, a nonempty list allows only those IDs, and [] allows no tools. Thinker
# is predefined with a child-agent orchestration allowlist.
profiles:
  general:
    prompt: '@builtin:profile-prompts/general.md'
    usage: Select for general-purpose assistance, handling tasks directly and delegating when useful.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    is_user_selectable: true
    is_agent_selectable: false
  coordinator:
    prompt: '@builtin:profile-prompts/coordinator.md'
    usage: Select for communicating with the user while delegating the requested work to subagents and AgentTasks.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    is_user_selectable: true
    is_agent_selectable: false
  build:
    prompt: '@builtin:profile-prompts/build.md'
    usage: Select for implementing and verifying requested changes.
    max_turns: 1024
    recursion_limit: 5
    read_only: false
    is_user_selectable: true
    is_agent_selectable: false
  plan:
    prompt: '@builtin:profile-prompts/plan.md'
    usage: Select for read-only investigation and writing a plan.
    max_turns: 1024
    recursion_limit: 5
    read_only: true
    is_user_selectable: true
    is_agent_selectable: false
  query:
    prompt: '@builtin:profile-prompts/query.md'
    usage: Select for read-only questions about the project.
    max_turns: 8
    recursion_limit: 3
    read_only: true
    is_user_selectable: true
    is_agent_selectable: false
  explorer:
    usage: Delegate focused read-only codebase investigation and evidence gathering.
    prompt: '@builtin:profile-prompts/explorer.md'
    max_turns: 32
    recursion_limit: 4
    read_only: true
    is_user_selectable: false
    is_agent_selectable: true
  review:
    usage: Delegate defect-first read-only review of a requested change.
    prompt: '@builtin:profile-prompts/review.md'
    max_turns: 32
    recursion_limit: 5
    read_only: true
    is_user_selectable: false
    is_agent_selectable: true
  worker:
    usage: Delegate independently scoped implementation or production work.
    prompt: '@builtin:profile-prompts/worker.md'
    max_turns: 128
    recursion_limit: 6
    read_only: false
    is_user_selectable: false
    is_agent_selectable: true
  thinker:
    prompt: '@builtin:profile-prompts/thinker.md'
    usage: Delegate difficult read-only analysis and decision-making, typically to an expensive model.
    allowed_tools:
      - agent_spawn
      - set_checkpoint
      - read
      - agent_send
      - question
      - ask
      - reply
      - wait
    max_turns: 256
    recursion_limit: 1
    read_only: true
    is_user_selectable: false
    is_agent_selectable: true
