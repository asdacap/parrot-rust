prompt_templates:
  agent-task.assignment-context:
    engine: minijinja
    template: |-
      {% if siblings %}Sibling tasks (out of scope):
      These tasks belong to other agents. Do not implement or duplicate their work. You may consume dependency results for your assigned task.{% for sibling in siblings %}
      [{{ sibling.name }}] {{ sibling.description }}{% endfor %}
      {% endif %}Task: {{ task_name }}
      Description: {{ description }}
      Acceptance criteria: {{ acceptance_criteria }}{% if dependencies %}
      Direct dependency summaries:{% for dependency in dependencies %}
      [{{ dependency.name }}] {{ dependency.description }}
      Result: {{ dependency.result }}{% endfor %}{% endif %}
      This task is your current assignment and supersedes prior task instructions. Inherited parent history is context, not additional assignments.
    allowed_arguments: [task_name, description, acceptance_criteria, dependencies, siblings]
    required_arguments: [task_name, description, acceptance_criteria, dependencies, siblings]
  agent-task.result:
    template: |-
      Prior leaf result:
      {result}
    allowed_arguments: [result]
    required_arguments: [result]
  agent-task.feedback:
    template: |-
      Retry feedback:{items}
    allowed_arguments: [items]
    required_arguments: [items]
  agent-task.child-scope:
    template: 'AgentTask {role} for {task_name}'
    allowed_arguments: [role, task_name]
    required_arguments: [role, task_name]
  agent-task.leaf:
    template: |-
      AgentTask role: payload executor{header}{feedback}
      Inspect, implement, and verify this instruction:
      {instruction}
      Return only one strict JSON object with no prose or code fence: {{"result":"nonblank","verdict":"accept"}}, {{"result":"nonblank","verdict":"reject_and_halt","feedback":"nonblank"}}, or {{"result":"nonblank","verdict":"reject_and_retry","feedback":"nonblank","payload":"optional replacement instruction","replacement_result":"optional nonblank replacement result"}}.
      Omit replacement_result to carry the returned result into the next attempt.
    allowed_arguments: [header, feedback, instruction]
    required_arguments: [header, feedback, instruction]
  agent-task.composite:
    template: |-
      AgentTask role: composite owner{header}{feedback}
      The following inner task list is provided:
      {children}
      Reuse supplied context and preparation results. Perform only necessary owner-level preparation not assigned elsewhere, then use set_agent_tasks to declare and manage the supplied provisional work in your own graph. On retries or restarts, inspect your existing tasks and reconcile the supplied definitions yourself.
      The provided task list is provisional, not fixed; you may change it as needed to satisfy the task’s scope and acceptance criteria.
      Perform inner tasks assigned to self in your current agent and record each self task's outcome and result with set_agent_tasks. Supervise dedicated workers and handle later self-assignment notifications without waiting for another setter call. When an inner task fails, resolve it with set_agent_tasks by setting its state to pending to retry it, to succeeded with a result to accept it, or to canceled to cancel it and its dependents. You cannot finish while an inner task is unresolved. Your final JSON does not complete an inner self task.
      When every inner task, including self tasks, is resolved, return only one strict JSON object with no prose or code fence: {{"result":"nonblank","verdict":"accept"}}, {{"result":"nonblank","verdict":"reject_and_halt","feedback":"nonblank"}}, or {{"result":"nonblank","verdict":"reject_and_retry","feedback":"nonblank"}}.
    allowed_arguments: [header, feedback, children]
    required_arguments: [header, feedback, children]
  agent-task.composite-child:
    template: "\n[{name}] {description}"
    allowed_arguments: [name, description]
    required_arguments: [name, description]
  agent-task.attempts-exhausted:
    template: 'rejected after {attempts} attempts: {feedback}'
    allowed_arguments: [attempts, feedback]
    required_arguments: [attempts, feedback]
  agent-task.set-accepted:
    template: |-
      AgentTask update accepted ({count} tasks). State changes are delivered as notifications.
    allowed_arguments: [count]
    required_arguments: [count]
  agent-task.set-assigned:
    engine: minijinja
    template: |-
      AgentTask update accepted ({{ count }} tasks).
      {% if self_assignment %}AgentTask assigned to self: {{ self_assignment.name }}
      Description: {{ self_assignment.description }}
      Instruction:
      {{ self_assignment.instruction }}
      Acceptance criteria: {{ self_assignment.acceptance_criteria }}
      Direct dependency results:{% for dependency in self_assignment.dependencies %}
      [{{ dependency.name }}] {{ dependency.description }}
      Result: {{ dependency.result }}{% endfor %}
      Perform this task in your current agent. Complete it with set_agent_tasks by recording its outcome and result. Your final response does not complete this self assignment.
      {% else %}No task is currently assigned to self.
      {% endif %}{% if dedicated %}Active dedicated tasks (out of scope):{% for assignment in dedicated %}
      [{{ assignment.name }}] {{ assignment.description }}
      Assigned agent: {{ assignment.agent_path }}{% endfor %}{% else %}No dedicated tasks are currently active.{% endif %}
    allowed_arguments: [count, self_assignment, dedicated]
    required_arguments: [count, self_assignment, dedicated]
  agent-task.self-dependency:
    template: "\n[{name}] {description}\nResult: {result}"
    allowed_arguments: [name, description, result]
    required_arguments: [name, description, result]
  agent-task.notification-assigned-self:
    template: |-
      AgentTask assigned to self: {name}
      Description: {description}
      Instruction:
      {instruction}
      Acceptance criteria: {acceptance_criteria}
      Direct dependency results:
      {dependencies}
      Perform this task in your current agent. Complete it with set_agent_tasks by recording its outcome and result. Your final response does not complete this self assignment. Other assigned tasks remain out of scope.
    allowed_arguments: [name, description, instruction, acceptance_criteria, dependencies]
    required_arguments: [name, description, instruction, acceptance_criteria, dependencies]
  agent-task.notification-succeeded:
    template: |-
      AgentTask succeeded: {name}
      Description: {description}

      Result:
      {result}
    allowed_arguments: [name, description, result]
    required_arguments: [name, description, result]
  agent-task.notification-failed:
    template: |-
      AgentTask failed: {name}
      Description: {description}

      Failure:
      {failure}

      Its dependents wait until you resolve it with set_agent_tasks: set its state to pending to retry it, to succeeded with a result to accept it, or to canceled to cancel it and its dependents.
    allowed_arguments: [name, description, failure]
    required_arguments: [name, description, failure]
  agent-task.notification-updated:
    template: |-
      AgentTask states changed by your update:{items}
    allowed_arguments: [items]
    required_arguments: [items]
  agent-task.notification-all-complete:
    template: |-
      All AgentTasks are complete:{items}
    allowed_arguments: [items]
    required_arguments: [items]
  agent-task.notification-item:
    template: "\n- {name}: {state}"
    allowed_arguments: [name, state]
    required_arguments: [name, state]
  agent-task.force-stopped:
    template: 'Your AgentTask turn was stopped: {reason}'
    allowed_arguments: [reason]
    required_arguments: [reason]
  agent-task.stop-canceled:
    template: 'the owner canceled this task.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-succeeded:
    template: 'the owner marked this task as succeeded.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-failed:
    template: 'the owner marked this task as failed.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-restarted:
    template: 'the owner reset or changed this task; it restarts in this session.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-dependency-canceled:
    template: 'a task this task depends on was canceled.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-dependency-reset:
    template: 'a task this task depends on was reset; it restarts in this session once that task succeeds again.'
    allowed_arguments: []
    required_arguments: []
  agent-task.stop-shutdown:
    template: 'the agent session is shutting down.'
    allowed_arguments: []
    required_arguments: []
  agent-task.response-repair:
    template: >-
      Your previous response was not accepted: {error} Reply again with only the required strict JSON object for this role and nothing else.
    allowed_arguments: [error]
    required_arguments: [error]
  agent-task.role-failure:
    template: '{role} agent {status}: {error}'
    allowed_arguments: [role, status, error]
    required_arguments: [role, status, error]
  agent-task.truncated:
    template: |-
      {value}
      [truncated]
    allowed_arguments: [value]
    required_arguments: [value]

profiles:
  agent-task-payload:
    usage: Execute an AgentTask payload and verify its observable result.
    prompt: '@builtin:profile-prompts/agent-task-payload.md'
    max_turns: 128
    recursion_limit: 6
    read_only: false
    is_user_selectable: false
    is_agent_selectable: true

# Maximum payload execution attempts for each AgentTask invocation.
agent_tasks:
  extra_concurrent_tasks: 2
  maximum_attempts: 5
  # Maximum re-prompts per role turn when the response is not the required strict JSON.
  maximum_response_repairs: 3
  # Fresh AgentTask history source: dependency (first dependency, otherwise parent), parent, or empty.
  fork_history_mode: dependency

system_prompts:
  runtime:system-context:02a-agent-tasks: '@builtin:system-prompts/agent-tasks.md'

tools:
  set_agent_tasks:
    description: Upsert tasks by name into your own AgentTask graph. The scheduler assigns one ready ordinary instruction leaf to self in stable graph order. Composites, tasks with model overrides, and other admitted parallel work run on retained dedicated child agents. Self uses no child capacity; a zero extra-task budget permits one self task plus one free dedicated run per owner, including nested owners. Perform self work in your current agent and explicitly record its outcome and result with set_agent_tasks; final chat or JSON does not complete self work. Dedicated workers implement, verify, and retry internally on rejection; their strict final JSON completes their parent task, and restarts retain their child session. The accepted response describes your self assignment and active dedicated work. Recovered accepted calls replay the exact originally sealed response before arguments or artifact files are reread; use get_agent_tasks and later notifications for current state. Later self assignments arrive automatically without another setter call; existing dedicated runs remain stable. You are notified when a task succeeds, when it fails, after each of your updates, and when every task is complete. A failed task holds its dependents until you resolve it by setting its state to pending to retry it, to succeeded with a result to accept it, or to canceled. Changing a running dedicated task's state or execution definition stops its worker execution. Changing a self task invalidates its assignment but does not stop your owner conversation. Updating only visibility with state running preserves its execution. A canceled task also cancels every task that depends on it until it is set back to pending, and resetting a succeeded task to pending resets its dependents too. Each agent sets hidden=true on all its tasks when its nonempty graph transitions to all-succeeded-or-canceled. A task whose payload is a task array passes the full inner task list to its child prompt. The child must use set_agent_tasks to declare and manage its own graph; the runtime does not register or synchronize that list.
    parameters:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          description: Path to an approved AgentTask v1 JSON artifact whose tasks are upserted. The path must resolve to a readable regular file without symbolic links.
        tasks:
          type: array
          minItems: 1
          items:
            $ref: '#/$defs/task'
          description: Full tasks to upsert, each including its state. Dependencies may name tasks set by earlier calls.
      oneOf:
      - required:
        - path
      - required:
        - tasks
      additionalProperties: false
      $defs:
        task:
          type: object
          description: A task in an AgentTask graph, including its state.
          properties:
            name:
              type: string
              minLength: 1
              description: Unique task name in the graph; an existing task with this name is updated.
            dependencies:
              type: array
              items:
                type: string
                minLength: 1
                description: Name of a task in the same graph that this task depends on.
              uniqueItems: true
              description: Optional distinct dependencies.
            description:
              type: string
              minLength: 1
              maxLength: 300
              description: Work the task must perform.
            hidden:
              type: boolean
              description: Hide this task and its subtree from task-specific CLI views. Defaults to false. The CLI temporarily shows active dedicated-worker activity using the worker ID. Non-hidden self tasks stay visible without a child link. Hidden self tasks stay hidden. Each agent automatically sets this true when all tasks in its nonempty graph succeed or are canceled.
            payload:
              oneOf:
              - type: string
                minLength: 1
                description: Direct task instruction.
              - type: array
                minItems: 1
                items:
                  $ref: '#/$defs/task'
                description: Inner task definitions passed to the child prompt; the child declares and owns its own graph.
              description: Direct instruction or a full inner task list passed to the child prompt for explicit registration with set_agent_tasks.
            acceptance_criteria:
              type: string
              minLength: 1
              description: Criteria used to accept the completed task.
            model:
              type: string
              minLength: 1
              description: Optional model selector that forces dedicated execution for this task. Selection applies when its retained child agent is first created.
            state:
              type: string
              enum:
              - pending
              - running
              - succeeded
              - failed
              - canceled
              description: Desired state, pending when omitted. Pending retries or restarts the task, succeeded accepts it with the given result, canceled cancels it and its dependents, and running keeps a running task with an unchanged definition.
            result:
              type: string
              minLength: 1
              description: Result passed to dependents when setting the state to succeeded.
            failure:
              type: string
              minLength: 1
              description: Reason recorded when setting the state to failed.
          required:
          - name
          - description
          - payload
          - acceptance_criteria
          additionalProperties: false
  get_agent_tasks:
    description: Read your own AgentTask graph. Without a name, lists every task with its name, state, description, hidden flag, and optional read-only assigned_to. With a name, returns that task in full, including its state, result, failure, and assignment metadata, in the shape set_agent_tasks accepts plus execution metadata. assigned_to is self or the absolute registered agent path of its dedicated worker. It is omitted for never-assigned tasks and retains the last assignee after completion until reset. Read-only agent_name remains the dedicated-worker compatibility alias. Do not send assignment metadata to set_agent_tasks. Hidden tasks remain in the returned JSON. The CLI hides them from task-specific displays; live progress temporarily shows active dedicated-worker activity and the paths to active descendants. Hidden self tasks stay hidden.
    parameters:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Name of the task to return in full; omit it to list every task.
      additionalProperties: false
