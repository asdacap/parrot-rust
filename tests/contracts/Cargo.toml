[package]
name = "parrot-contract-checks"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
parrot-domain = { path = "../../crates/parrot-domain" }

[patch.crates-io]
