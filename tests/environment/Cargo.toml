[package]
name = "parrot-environment-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
parrot-domain = { path = "../../crates/parrot-domain" }
parrot-foundation = { path = "../../crates/parrot-foundation" }
parrot-host = { path = "../../crates/parrot-host", default-features = false }
parrot-provider = { path = "../../crates/parrot-provider" }
parrot-runtime = { path = "../../crates/parrot-runtime" }
parrot-storage = { path = "../../crates/parrot-storage" }
parrot-tools = { path = "../../crates/parrot-tools" }
futures-core = "0.3.34"
openssl = { version = "0.10.81", features = ["vendored"] }
protobuf = "3.7.2"
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.43", default-features = false, features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tonic = { version = "0.12.3", default-features = false, features = ["transport", "codegen", "tls", "tls-webpki-roots"] }

[features]
default = ["web"]
web = ["parrot-host/web"]

[patch.crates-io]
protobuf = { path = "../../vendor/rust-protobuf-a001/protobuf" }
protobuf-codegen = { path = "../../vendor/rust-protobuf-a001/protobuf-codegen" }
tonic = { path = "../../vendor/tonic-0.12.3" }

[profile.dev]
debug = "line-tables-only"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
